# The fleet THIS repository runs (cb-i3l.3). This file replaces scripts/roster's built-in table
# rather than merging with it, so what is left out is as much a decision as what is here.
#
# Order is load-bearing, not display: the interactive roles come first, and the orchestrator takes
# the next unused producer name in file order.
#
# A third word, `autostart', starts that agent with `M-x cerebro' (cb-0r6); omitted means the
# navigator starts it with `s'. Any other third word refuses, so a typo cannot read as "no".
#
# NAME          ROLE            [autostart]

Cerebro         orchestrator	autostart
Xavier          ux		standby
Beast		ux		standby
#Moira		user-feedback
Psylocke        verifier
#Cypher          reviewer
Morph           bugfixer
Forge           architect
Bishop         bugfixer	standby
Cyclops         producer	standby
Storm           producer 	standby
Wolverine       producer 	standby
Rogue           producer 	standby

# Four producers can each take one UX-agreed bead; a fifth producer name would
# only be a row in the fleet view nobody starts.
#
# One of cerebro's seven roles is deliberately NOT here:
#
#   user-feedback  Moira owns an external issue inbox and keeps each issue's status comments in
#                  step with its bead. The issues here are written by the navigator, who is already
#                  in the room; there is no reporter to thank and no status to relay. Add her if
#                  this repository starts taking bug reports from people who do not run its fleet.
