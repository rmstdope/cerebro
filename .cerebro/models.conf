# Which model each agent runs on, overriding what its `agents/<role>.md` declares.
#
# <agent-name | role | default>   <model | ->   [effort]
default     opus    medium
implementer opus    low
planner     opus    medium
verifier    opus    medium
architect   fable   medium
feedback    opus    low

# The same fleet on GitHub Copilot, as an example - this project declares `agent_cli claude', so
# every line below is inert. Copilot's model ids are its own, and it refuses an id it does not
# know outright rather than falling back, so an id here is validated against `--model' and not
# against the picker. These two were measured accepted:
#
# default@copilot      auto
# implementer@copilot  gpt-5-mini
