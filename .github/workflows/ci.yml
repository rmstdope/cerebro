name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          # On pull_request the checkout is the PR's merge commit, whose first parent is the base
          # tip: two commits are the whole diff, and a two-dot diff needs no more history than that.
          # Leave `ref:' unset - overriding it stops actions/checkout checking out the merge commit.
          fetch-depth: 2

      - name: Decide whether the gate can be affected
        id: decide
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "not a pull request: everything runs"
            exit 0
          fi
          # --no-renames: a file renamed OUT of a gated path is listed as a deletion of the old
          # path, so the gate still runs. On any diff failure, changed is empty and ci-needed
          # answers "run everything".
          changed="$(git diff --name-only --no-renames HEAD^1 HEAD 2>/dev/null)" || changed=""
          # ci-needed's stdout IS the output line; its reasons are on stderr, in the log. Under the
          # -e GitHub puts on the interpreter's own command line, a predicate that crashes fails
          # this step, and a failed `changes' job skips nothing (see the `if:' on the gated jobs).
          # No `set' line of any kind here: that -e is the safety net now, and defusing it is what
          # turned the first docs-only pull request red (cb-ypx, cb-e33).
          #
          # Without `shell: bash' the interpreter is `bash -e {0}' - -e, and NOT -o pipefail (cb-e33
          # measured it). ci-needed's status still reaches the step because it is the LAST command
          # in the pipe. Do not append anything after it.
          printf '%s\n' "$changed" | bash scripts/ci-needed >> "$GITHUB_OUTPUT"

  bash-tests:
    name: Bash suites (ubuntu-latest)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    steps:
      - uses: actions/checkout@v4

      # tests/fleet-view-restart.sh (R15, cb-jj2o) and tests/fleet-keys.sh (R9, cb-t8dm) build and
      # run the real cerebro-tui, so this job needs the toolchain too, and the same dependency cache
      # the Rust job keeps (cb-bkda) - without it every run compiles every dependency crate again.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The same script tests/gate runs, so the two loops cannot drift (cb-8cn). It emits the
      # ::group::/::error annotations this step used to write inline, because GitHub sets
      # GITHUB_ACTIONS on every job.
      - name: Run every tests/*.sh
        run: bash scripts/suite-runner tests

  rust-tests:
    name: Rust tests
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The Rust item-adjacency integration target compares source metadata to merge-base.
          # A full history keeps origin/main available even after the PR merge commit is checked out.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      # Without a cache every run compiled all ~139 dependency crates, about 39s of a 49s step,
      # and this job set every run's wall time (cb-bkda). The key hashes Cargo.lock, every
      # Cargo.toml and the rustc version; workspace crates are pruned from what is saved, so only
      # dependencies are restored. A pull request reads the cache main's runs save.
      - uses: Swatinem/rust-cache@v2

      # Locked, same as tests/gate: never let CI resolve a dependency crates.io was not asked to
      # fix in place, and --all-targets so a test-only compile error cannot hide behind a green
      # `cargo build`. That includes the item-adjacency integration target, which reads the
      # merge-base fetched above.
      - name: cargo test
        run: cargo test --workspace --all-targets --locked

  web-console:
    name: Web console UI
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    steps:
      - uses: actions/checkout@v4

      # The version comes from the `packageManager' field if one is ever added; until then this one.
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web-console/ui/pnpm-lock.yaml

      # The browser suite starts cerebro-web, so this job builds the Rust workspace's service too.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The same script tests/gate runs (cb-yq4c): install from the lockfile, tsc -b, the
      # Playwright suite against cerebro-web and Vite on a port block smoke-port reserves.
      - name: Type-check and browser suite
        run: bash tests/web-console-ui
