# What is true about THIS project, read one key at a time by .claude/cerebro/scripts/project-conf.
# Tracked, like every consumer's: how a project is gated is a fact every clone needs, and an
# ignored copy vanishes on a fresh clone and takes the declaration with it.
#
# A value runs to the end of the line, and can never contain a `#' - everything from one on is a
# comment, wherever it starts.

project_name   Cerebro
default_branch main

# Which agent CLI this fleet's sessions run on, read by .claude/cerebro/scripts/agent-cli.
# Absent would mean claude too; it is declared because this repository's declarations are the
# worked example every consumer copies from.
agent_cli      copilot

# Whoever runs a fleet. This repository ships a harness rather than an application, and `navigator'
# is what every agent document here already calls the human it answers to.
audience_noun  navigator

# What the audience can see. The classification is INVERTED here compared to every other consumer:
# `scripts/' is the fleet talking to itself in a project that USES cerebro, and is the product in
# the project that IS cerebro. Everything a consumer runs or mounts is application; `docs/',
# `tests/', `.github/' and the root documents are this repository talking to itself.
# `fleet-view/' and the two Cargo manifests joined this list with cb-vyp.1: the standalone Rust
# fleet view is application code the same way `scripts/' is, and since cb-vyp.2 it is the one part
# of it a navigator can start and look at.
app_paths      ^(agents|emacs|fleet-view|githooks|hooks|scripts|skills|templates)/|^Cargo\.(toml|lock)$

# The Rust workload, read by `scripts/build-workload --classify`: which changed paths are Cargo's
# to build rather than the Bash/Emacs gate's. Kept separate from `app_paths` above - the two
# questions ("can the audience see this" and "does this need `cargo test`") happen to answer the
# same way today, but are not the same question, and a future non-Rust application path must not
# accidentally join the Cargo build just because it is user-visible.
rust_paths     ^(Cargo\.(toml|lock)$|fleet-view/)

# The Rust build's own facts, all landing together with the first crate (cb-vyp.1) so later
# implementers inherit the right preflight and build contract from the start rather than
# discovering it missing mid-bead:
#   install                 fetch dependencies from the lockfile alone, never touching crates.io's
#                           resolver - the whole point of committing Cargo.lock.
#   prewarm                 build once ahead of a session, so a suite that needs the workspace
#                           already built fails on what it changed rather than on a missing
#                           artefact (see disk-preflight's `--workload rust`).
#   disk_floor_gb           a Rust build tree is heavier than this repository's own text, and
#                           several worktrees each keep one - see `scripts/disk-preflight`'s own
#                           header for why running out announces itself as a linker fault instead.
#   reclaim_dirs            what disk-preflight and prune-worktrees.sh may offer to reclaim.
#   cargo_reclaim_packages  which packages' build artefacts `cargo clean --package` may reclaim,
#                           read by disk-preflight's `--workload rust` measurement.
install                cargo fetch --locked
prewarm                cargo build --workspace --locked
disk_floor_gb          2
reclaim_dirs           target
cargo_reclaim_packages cerebro-tui

# One runner for both gates, because this project has one definition of green and it is small
# enough to run whole: byte-compile, ERT, every tests/*.sh, and (since cb-vyp.1) the locked Cargo
# test suite - exactly what .github/workflows/ci.yml runs. A separate faster gate would only be
# worth having if the full one were slow, and it takes under a minute.
gate_fast      bash tests/gate
gate_full      bash tests/gate

# What a person can start and look at, since cb-vyp.2: the standalone Ratatui fleet view. One
# target, no port - it draws in the terminal it is started in and serves nothing.
#
# The launcher is a reader. Starting it changes no state file, no stop flag and no bead, so a
# verification may run it beside a live fleet - and beside `M-x cerebro', which remains the only
# supervisor. It builds the workspace on its first run in a fresh checkout, so allow it a minute
# before deciding it has hung.
launch_targets tui
launch_tui     .claude/cerebro/scripts/cerebro-tui

# `verification none' is GONE, and its absence is the declaration (cb-vyp.2). It said that nothing
# here could be verified by looking, which was true while this repository shipped only a harness:
# agent files, skills and scripts a navigator cannot open and judge. The Ratatui fleet view is an
# application, so Psylocke offers hands-on verification for merged beads that touched it - and,
# for a bead that changed only prose or an agent document, still records not-needed for the
# reason above.


# Seconds between two starts of one role, read by emacs/cerebro.el. Only a role two or more agents
# hold is ever spaced, so here it is the two planners and nothing else. Sixty rather than the
# built-in thirty because the gap this has to exceed is launch to the `planning:' label reaching
# the remote - process start, skill load, a bd pull, the candidate query and the push - which is
# about a minute on this fleet. 0 would mean never space that role.
role_start_spacing_planner  60

# Deliberately absent, every one of them - an accident and a decision read identically to
# project-conf, so the decisions are written down here. `install', `prewarm' and `disk_floor_gb'
# left this list with cb-vyp.1: the Rust workspace gave emacs-and-bash a build step and a floor to
# enforce, declared above alongside `rust_paths' rather than here.
#
#   retro_dir       no retrospectives yet. The fleet has not run here long enough to have any, and
#                   an empty directory would make retro-sightings report on nothing.
#   release_cmd     no release process. Consumers take this repository at a sha, by bumping the
#                   submodule; there is no tag, no artifact and nothing to watch after one.
#   launch_tui_port no port. The fleet view draws in the terminal it was started in and serves
#                   nothing, which is also why there is no port_base, port_block_size or port_env.
#   verification_skill   no procedure of our own to declare yet. The fleet view is looked at the
#                        way any terminal application is - start it, read the rows, resize it, quit
#                        - and the bead being verified says what changed. A consumer whose
#                        application needs a procedure declares `verification_skill <skill name>`,
#                        and the verifier loads that skill before it prepares anything.
#   role_start_spacing_implementer
#                   the built-in 30s stands. The implementers' gap stops a queue that fills from
#                   starting the whole roster in one tick, and nothing has measured it wrong.
