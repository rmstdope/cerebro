# The fleet THIS repository runs (cb-i3l.3). This file replaces scripts/roster's built-in table
# rather than merging with it, so what is left out is as much a decision as what is here.
#
# Order is load-bearing, not display: the interactive roles come first, plan-bead gives the P4
# triage pass to the FIRST planner listed, and the orchestrator takes the next unused implementer
# name in file order.
#
# A third word, one of two. `autostart' starts that agent with `M-x cerebro' (cb-0r6); `standby'
# ARMS it without starting it (cb-98u) - the row reads `standby' from the moment the view opens and
# the role's own trigger is what starts it. Omitted means the navigator starts it with `s'. Any
# other third word refuses, so a typo cannot read as "no".
#
# NAME          ROLE            [autostart|standby]

Cerebro         orchestrator	autostart
Xavier          planner         autostart
Beast           planner         autostart
#Cypher          reviewer
Forge           architect
Psylocke        verifier        autostart
Moira		user-feedback	autostart
Cyclops         implementer     autostart
Storm           implementer     autostart
Wolverine       implementer     autostart
Rogue           implementer     autostart
