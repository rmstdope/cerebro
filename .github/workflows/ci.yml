name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          # On pull_request the checkout is the PR's merge commit, whose first parent is the base
          # tip: two commits are the whole diff, and a two-dot diff needs no more history than that.
          # Leave `ref:' unset - overriding it stops actions/checkout checking out the merge commit.
          fetch-depth: 2

      - name: Decide whether the gate can be affected
        id: decide
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "not a pull request: everything runs"
            exit 0
          fi
          # --no-renames: a file renamed OUT of a gated path is listed as a deletion of the old
          # path, so the gate still runs. On any diff failure, changed is empty and ci-needed
          # answers "run everything".
          changed="$(git diff --name-only --no-renames HEAD^1 HEAD 2>/dev/null)" || changed=""
          # ci-needed's stdout IS the output line; its reasons are on stderr, in the log. Under the
          # -e GitHub puts on the interpreter's own command line, a predicate that crashes fails
          # this step, and a failed `changes' job skips nothing (see the `if:' on the gated jobs).
          # No `set' line of any kind here: that -e is the safety net now, and defusing it is what
          # turned the first docs-only pull request red (cb-ypx, cb-e33).
          #
          # Without `shell: bash' the interpreter is `bash -e {0}' - -e, and NOT -o pipefail (cb-e33
          # measured it). ci-needed's status still reaches the step because it is the LAST command
          # in the pipe. Do not append anything after it.
          printf '%s\n' "$changed" | bash scripts/ci-needed >> "$GITHUB_OUTPUT"

  emacs-28:
    name: ERT (Emacs 28.2)
    runs-on: ubuntu-latest
    needs: changes
    # A literal name, not a matrix (cb-ypx second pass): a SKIPPED matrix job reports one check run
    # under its unexpanded name, so the required contexts never report and a docs-only pull request
    # blocks. Two plain jobs skip under the exact names branch protection requires.
    #
    # NOT the default success(): a failed `changes' job would SKIP this one, and a skipped required
    # check is green. `!= 'false'` runs on an empty output too, so the filter can only ever skip
    # on an explicit "false".
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: purcell/setup-emacs@master
        with:
          # cerebro.el targets Emacs 28+; test the floor and a current release.
          version: '28.2'

      - name: Byte-compile
        run: emacs --batch -L emacs -f batch-byte-compile emacs/cerebro.el

      - name: Run tests
        run: emacs --batch -L emacs -l cerebro-test -f ert-run-tests-batch-and-exit

  emacs-30:
    name: ERT (Emacs 30.1)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: purcell/setup-emacs@master
        with:
          # The floor is 28.2 above; this is a current release.
          version: '30.1'

      - name: Byte-compile
        run: emacs --batch -L emacs -f batch-byte-compile emacs/cerebro.el

      - name: Run tests
        run: emacs --batch -L emacs -l cerebro-test -f ert-run-tests-batch-and-exit

  bash-tests:
    name: Bash suites (ubuntu-latest)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    steps:
      - uses: actions/checkout@v4

      # The same script tests/gate runs, so the two loops cannot drift (cb-8cn). It emits the
      # ::group::/::error annotations this step used to write inline, because GitHub sets
      # GITHUB_ACTIONS on every job.
      - name: Run every tests/*.sh
        run: bash scripts/suite-runner tests

  rust-tests:
    name: Rust tests
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Locked, same as tests/gate: never let CI resolve a dependency crates.io was not asked to
      # fix in place, and --all-targets so a test-only compile error cannot hide behind a green
      # `cargo build`.
      - name: cargo test
        run: cargo test --workspace --all-targets --locked
