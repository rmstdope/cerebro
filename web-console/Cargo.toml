[package]
name = "cerebro-web"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
cerebro-tui = { path = "../fleet-view" }
chrono = { version = "0.4", features = ["serde"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "net", "rt-multi-thread", "macros", "time"] }
tower-http = { version = "0.6", features = ["fs"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
# Paused time, so a test of the event interval does not wait it out.
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
