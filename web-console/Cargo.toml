[package]
name = "cerebro-web"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
cerebro-tui = { path = "../fleet-view" }
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros"] }
tower-http = { version = "0.6", features = ["fs"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
