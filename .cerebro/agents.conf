# What each agent runs on: which tool, which model, how hard it thinks.
# See .cerebro/cerebro/agents.conf.example for the shape.

external glm-5.3-flash openai https://openrouter.ai/api/v1 ${OPENROUTER_API_KEY} z-ai/glm-5.3-flash

#default      tool=claude  model=opus   effort=medium
#producer     tool=claude  model=opus   effort=low
#verifier     tool=claude  model=opus   effort=low
#architect    tool=claude  model=fable  effort=medium

default      tool=copilot  model=gpt-5.6-terra	effort=high
producer     tool=copilot  model=gpt-5.6-terra  effort=medium
verifier     tool=copilot  model=gpt-5.6-terra  effort=medium
architect    tool=copilot  model=gpt-5.6-sol    effort=medium
