[package]
name = "cerebro-tui"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "cerebro-tui"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
crossterm = "0.29"
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
