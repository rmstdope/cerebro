# What is true about THIS project, read one key at a time by .claude/cerebro/scripts/project-conf.
# Tracked, like every consumer's: how a project is gated is a fact every clone needs, and an
# ignored copy vanishes on a fresh clone and takes the declaration with it.
#
# A value runs to the end of the line, and can never contain a `#' - everything from one on is a
# comment, wherever it starts.

project_name   Cerebro
default_branch main

# Which agent CLI this fleet's sessions run on, read by .claude/cerebro/scripts/agent-cli.
# Absent would mean claude too; it is declared because this repository's declarations are the
# worked example every consumer copies from.
agent_cli      copilot

# Whoever runs a fleet. This repository ships a harness rather than an application, and `navigator'
# is what every agent document here already calls the human it answers to.
audience_noun  navigator

# What the audience can see. The classification is INVERTED here compared to every other consumer:
# `scripts/' is the fleet talking to itself in a project that USES cerebro, and is the product in
# the project that IS cerebro. Everything a consumer runs or mounts is application; `docs/',
# `tests/', `.github/' and the root documents are this repository talking to itself.
app_paths      ^(agents|emacs|githooks|hooks|scripts|skills|templates)/

# One runner for both gates, because this project has one definition of green and it is small
# enough to run whole: byte-compile, ERT, every tests/*.sh - exactly what .github/workflows/ci.yml
# runs. A separate faster gate would only be worth having
# if the full one were slow, and it takes under a minute.
gate_fast      bash tests/gate
gate_full      bash tests/gate

# Nothing here can be verified by looking. This repository ships a harness: every merged bead
# changes what the audience sees (app_paths above is right for the release notes) and none of it
# is an application a navigator can open and judge. So the verifier marks every merged bead
# not-needed, saying so once per pass, and never asks for a launch. Remove this line the day the
# project grows something a person can run and look at.
verification   none


# Seconds between two starts of one role, read by emacs/cerebro.el. Only a role two or more agents
# hold is ever spaced, so here it is the two planners and nothing else. Sixty rather than the
# built-in thirty because the gap this has to exceed is launch to the `planning:' label reaching
# the remote - process start, skill load, a bd pull, the candidate query and the push - which is
# about a minute on this fleet. 0 would mean never space that role.
role_start_spacing_planner  60

# Deliberately absent, every one of them - an accident and a decision read identically to
# project-conf, so the decisions are written down here:
#
#   install         nothing to install. No package manager, no lockfile: emacs and bash are the
#                   whole toolchain, and both are already on the machine that runs the fleet.
#   prewarm         nothing to build ahead of a session, for the same reason.
#   disk_floor_gb   no disk preflight. A worktree of this repository is a few megabytes of text;
#                   the floor exists for projects whose build artifacts fill a disk.
#   retro_dir       no retrospectives yet. The fleet has not run here long enough to have any, and
#                   an empty directory would make retro-sightings report on nothing.
#   release_cmd     no release process. Consumers take this repository at a sha, by bumping the
#                   submodule; there is no tag, no artifact and nothing to watch after one.
#   launch_targets  nothing to launch. There is no application to start and no port to serve it
#                   on, which is also why there is no port_base, port_block_size or port_env.
#                   Absent alone would make the verifier ASK how to run the application every
#                   pass; `verification none' above is what tells it not to.
#   verification_skill   no procedure of our own to declare, for the same reason - there is
#                        nothing here a person launches and looks at, so there is nothing to name a
#                        skill for. A consumer with an application and a verification procedure of
#                        its own declares `verification_skill <skill name>`, and the verifier loads
#                        that skill before it prepares anything.
#   role_start_spacing_implementer
#                   the built-in 30s stands. The implementers' gap stops a queue that fills from
#                   starting the whole roster in one tick, and nothing has measured it wrong.
